# OMV compose file "authelia": the passkey login (auth.joe-nas.net) in front
# of the web remote. Config, secrets and its database live in this stack's
# folder (/opt/docker/compose/authelia/config), which claude can't read.
services:
  authelia:
    image: authelia/authelia:4.39.28
    container_name: authelia
    restart: unless-stopped
    ports:
      - 127.0.0.1:9091:9091     # only Caddy (host network) reaches it
    environment:
      TZ: America/Chicago
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /config/secrets/jwt
      AUTHELIA_SESSION_SECRET_FILE: /config/secrets/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /config/secrets/storage
    volumes:
      - /opt/docker/compose/authelia/config:/config
    labels:
      - autoheal=true

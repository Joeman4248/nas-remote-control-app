[package]
name = "nas-remote"
version = "0.1.0"
edition = "2024"
description = "Web remote for joseph's NAS: the nas app's buttons behind an Authelia passkey"
publish = false

# Kept small on purpose: every crate here runs code at build time.
[dependencies]
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
toml = "1"

[profile.release]
strip = true
lto = true

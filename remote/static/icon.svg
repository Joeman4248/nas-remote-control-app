<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- NAS Remote home-screen icon: three drive bays with status lights, the
       app's colours on black. iOS rounds the corners itself. -->
  <defs>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4e"/><stop offset="1" stop-color="#2c2c2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#14304f"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
  </defs>
  <rect width="180" height="180" fill="url(#glow)"/>
  <g transform="translate(90 90) scale(1.3) translate(-56 -52)">
    <rect x="0" y="0"  width="112" height="28" rx="7" fill="url(#bay)"/>
    <rect x="0" y="38" width="112" height="28" rx="7" fill="url(#bay)"/>
    <rect x="0" y="76" width="112" height="28" rx="7" fill="url(#bay)"/>
    <g fill="#636366">
      <rect x="14" y="11" width="44" height="6" rx="3"/>
      <rect x="14" y="49" width="44" height="6" rx="3"/>
      <rect x="14" y="87" width="44" height="6" rx="3"/>
    </g>
    <circle cx="94" cy="14" r="6" fill="#30d158"/>
    <circle cx="94" cy="52" r="6" fill="#30d158"/>
    <circle cx="94" cy="90" r="6" fill="#0a84ff"/>
    <circle cx="78" cy="14" r="3" fill="#64d2ff" opacity=".8"/>
    <circle cx="78" cy="52" r="3" fill="#64d2ff" opacity=".8"/>
    <circle cx="78" cy="90" r="3" fill="#64d2ff" opacity=".8"/>
  </g>
</svg>
